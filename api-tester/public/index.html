<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 測試工具</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1c2128;--mut:#667085;--bd:#d8dce3;--pri:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--code:#f0f2f5;--hl:#e8efff}
@media(prefers-color-scheme:dark){:root{--bg:#12151a;--card:#1b2027;--fg:#e6e9ee;--mut:#98a2b3;--bd:#323a46;--pri:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--code:#14181d;--hl:#22304a}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card)}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:none}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:5px 10px}
button:hover{border-color:var(--pri)} button.pri{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
button.ghost{border:none;background:none;color:var(--mut);padding:2px 6px} button.ghost:hover{color:var(--bad)}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--card)}
header h1{font-size:14px;margin:0;white-space:nowrap}
#app{flex:1;min-height:0;display:grid;grid-template-columns:260px 1fr}
@media(max-width:760px){#app{grid-template-columns:1fr}#side{display:none}}
#side{border-right:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;min-height:0}
.stabs,.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd)}
.stabs button,.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:7px 10px;color:var(--mut)}
.stabs button.on,.tabs button.on{color:var(--fg);border-bottom-color:var(--pri);font-weight:600}
.sbody{flex:1;overflow:auto;padding:8px}
.item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer}
.item:hover{background:var(--code)} .item .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{font:700 10px ui-monospace,monospace;min-width:38px;text-align:center}
.GET{color:var(--ok)}.POST{color:var(--warn)}.PUT{color:var(--pri)}.PATCH{color:#7c3aed}.DELETE{color:var(--bad)}
.coll{margin-bottom:6px}.coll>.ch{display:flex;align-items:center;gap:4px;font-weight:600;padding:3px 2px}.coll>.ch span{flex:1}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#rtabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--bd);background:var(--card)}
.rt{display:flex;align-items:center;gap:6px;padding:6px 10px;border-right:1px solid var(--bd);cursor:pointer;white-space:nowrap;max-width:200px;color:var(--mut)}
.rt.on{background:var(--bg);color:var(--fg)} .rt .n{overflow:hidden;text-overflow:ellipsis} .rt .dot{color:var(--warn)}
#work{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px;gap:8px}
.urlbar{display:flex;gap:6px}.urlbar select{width:105px;font-weight:700}.urlbar input{flex:1}
#req,#res{background:var(--card);border:1px solid var(--bd);border-radius:8px;display:flex;flex-direction:column;min-height:0}
#req{flex:0 0 auto;max-height:46%} #res{flex:1}
.pane{padding:8px;overflow:auto;min-height:90px}
.kv{display:grid;grid-template-columns:22px 1fr 1fr 24px;gap:4px;margin-bottom:4px;align-items:center}
.kv input[type=checkbox]{width:auto}
.hint{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{padding:1px 8px;border-radius:10px;font-weight:700}
.s2{background:#dcfce7;color:#166534}.s3{background:#dbeafe;color:#1e40af}.s4{background:#fef3c7;color:#92400e}.s5,.se{background:#fee2e2;color:#991b1b}
pre{margin:0;font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
#resbody{flex:1;overflow:auto;padding:8px}
.k{color:#2563eb}.s{color:#15803d}.nu{color:#b45309}.b{color:#7c3aed}
@media(prefers-color-scheme:dark){.k{color:#7dd3fc}.s{color:#86efac}.nu{color:#fcd34d}.b{color:#c4b5fd}}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);width:min(560px,92vw)}
dialog::backdrop{background:#0006}
table{border-collapse:collapse;width:100%}td{border-bottom:1px solid var(--bd);padding:3px 6px;vertical-align:top;word-break:break-all}td:first-child{color:var(--mut);white-space:nowrap}
.sr{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>⚡ API 測試工具</h1>
  <span class="hint">請求由本機 server 代發，無 CORS 限制</span>
  <span class="hint" id="saved"></span>
  <span style="flex:1"></span>
  <label class="hint">環境</label>
  <select id="envsel" style="width:160px"></select>
  <button id="envedit">編輯</button>
  <button id="btn-import">匯入 curl</button>
</header>
<div id="app">
  <aside id="side">
    <div class="stabs"><button data-s="coll" class="on">集合</button><button data-s="hist">歷史</button></div>
    <div class="sbody" id="sbody"></div>
  </aside>
  <div id="main">
    <div id="rtabs"></div>
    <div id="work">
      <div class="urlbar">
        <select id="method"></select>
        <input id="url" placeholder="https://api.example.com/path?x=1　（可用 {{變數}}）" spellcheck="false">
        <button class="pri" id="send">送出 ⌘↵</button>
        <button id="save">儲存</button>
        <button id="copycurl" title="複製成 curl">curl</button>
      </div>
      <section id="req">
        <div class="tabs" id="reqtabs"></div>
        <div class="pane" id="reqpane"></div>
      </section>
      <section id="res">
        <div class="sr" id="sr"><span class="hint">按「送出」查看回應</span></div>
        <div class="tabs" id="restabs" hidden></div>
        <div id="resbody"></div>
      </section>
    </div>
  </div>
</div>

<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const METHODS = ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD', 'OPTIONS'];

const blank = () => ({ id: uid(), name: '', method: 'GET', url: '', params: [], headers: [], bodyType: 'none', body: '', form: [], auth: { type: 'none', token: '', user: '', pass: '' }, extract: [], collId: '', dirty: false, res: null });
const S = {
  tabs: [blank()], active: null, colls: [], hist: [], envs: [], env: '',
  side: 'coll', reqTab: 'params', resTab: 'body', pretty: true,
};
if (!S.tabs.find((t) => t.id === S.active)) S.active = S.tabs[0].id;
const cur = () => S.tabs.find((t) => t.id === S.active);
// ---- 持久化：存到 server 的 data/ 資料夾（不再依賴瀏覽器 localStorage）----
let ready = false, dirty = false, saveTimer = null, dataDir = '';
const snapshot = () => ({ tabs: S.tabs.map(({ res, ...t }) => t), active: S.active, colls: S.colls, hist: S.hist, envs: S.envs, env: S.env });
function setSaved(state, msg) {
  const el = $('#saved'); if (!el) return;
  el.textContent = state === 'ok' ? '💾 已儲存' : state === 'busy' ? '💾 儲存中…' : '⚠️ ' + msg;
  el.style.color = state === 'err' ? 'var(--bad)' : ''; el.title = dataDir ? '資料位置：' + dataDir : '';
}
function persist() { if (!ready) return; dirty = true; clearTimeout(saveTimer); setSaved('busy'); saveTimer = setTimeout(() => flush(), 300); }
async function flush(keepalive, force) {
  if (!ready || (!dirty && !force)) return; clearTimeout(saveTimer); // 沒有未存變更就不寫，避免蓋掉外部（手動 / 其他分頁）對檔案的修改
  const body = JSON.stringify(snapshot());
  try {
    const r = await fetch('/store', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body, keepalive: !!keepalive && body.length < 60000 });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
    dirty = false; setSaved('ok');
  } catch (e) { setSaved('err', '儲存失敗：' + e.message); }
}
window.addEventListener('pagehide', () => flush(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(true); });

/* ---------- 變數 ---------- */
const vars = () => Object.fromEntries(((S.envs.find((e) => e.id === S.env) || {}).vars || []).filter((v) => v.on !== false && v.k).map((v) => [v.k, v.v]));
const sub = (s) => { const v = vars(); let out = String(s ?? ''); for (let i = 0; i < 3; i++) { const n = out.replace(/\{\{\s*([\w.-]+)\s*\}\}/g, (m, k) => (k in v ? v[k] : m)); if (n === out) break; out = n; } return out; };

/* ---------- URL <-> params ---------- */
function syncParamsFromUrl(t) {
  const q = t.url.split('#')[0].split('?')[1];
  const parsed = q ? q.split('&').filter(Boolean).map((p) => { const i = p.indexOf('='); const d = (x) => { try { return decodeURIComponent(x.replace(/\+/g, ' ')); } catch { return x; } }; return { on: true, k: d(i < 0 ? p : p.slice(0, i)), v: i < 0 ? '' : d(p.slice(i + 1)) }; }) : [];
  t.params = [...parsed, ...t.params.filter((p) => p.on === false)];
}
function syncUrlFromParams(t) {
  const [base, hash] = t.url.split('#'); const root = base.split('?')[0];
  const q = t.params.filter((p) => p.on !== false && p.k).map((p) => encodeURIComponent(p.k) + '=' + encodeURIComponent(p.v)).join('&');
  t.url = root + (q ? '?' + q : '') + (hash !== undefined ? '#' + hash : '');
}

/* ---------- 組裝請求 ---------- */
function build(t) {
  const headers = {};
  t.headers.filter((h) => h.on !== false && h.k).forEach((h) => (headers[sub(h.k)] = sub(h.v)));
  const has = (n) => Object.keys(headers).some((k) => k.toLowerCase() === n);
  if (t.auth.type === 'bearer' && t.auth.token && !has('authorization')) headers.Authorization = 'Bearer ' + sub(t.auth.token);
  if (t.auth.type === 'basic' && !has('authorization')) headers.Authorization = 'Basic ' + btoa(unescape(encodeURIComponent(sub(t.auth.user) + ':' + sub(t.auth.pass))));
  if (t.auth.type === 'coll') {
    const cfg = (S.colls.find((c) => c.id === t.collId) || {}).cfg || {};
    const tok = vars().token;
    if (tok) {
      const hn = cfg.header || 'Authorization';
      if (!has(hn.toLowerCase())) headers[hn] = (cfg.prefix ?? 'Bearer ') + tok;
      if (cfg.cookie) { // 有些後台同時驗 Cookie（如 authKey）
        const ck = Object.keys(headers).find((k) => k.toLowerCase() === 'cookie'); const pair = cfg.cookie + '=' + tok;
        if (!ck) headers.Cookie = pair;
        else if (!(';' + headers[ck].replace(/\s/g, '')).includes(';' + cfg.cookie + '=')) headers[ck] += '; ' + pair;
      }
    }
  }
  let body;
  if (t.bodyType === 'json') { body = sub(t.body); if (!has('content-type')) headers['Content-Type'] = 'application/json'; }
  else if (t.bodyType === 'text') { body = sub(t.body); if (!has('content-type')) headers['Content-Type'] = 'text/plain'; }
  else if (t.bodyType === 'form') { body = t.form.filter((f) => f.on !== false && f.k).map((f) => encodeURIComponent(sub(f.k)) + '=' + encodeURIComponent(sub(f.v))).join('&'); if (!has('content-type')) headers['Content-Type'] = 'application/x-www-form-urlencoded'; }
  return { url: sub(t.url.trim()), method: t.method, headers, body };
}

/* ---------- 送出 ---------- */
const keyCache = {};
const RSA_RE = /\{\{\s*\$rsa\(\s*([\w.-]+)\s*\)\s*\}\}/g;
async function proxy(p) {
  const resp = await fetch('/proxy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) });
  return resp.json();
}
// 取得 RSA 公鑰：GET 環境變數 rsaKeyUrl，回應 data 為 PEM 字串（或 publicKey / rsaPublicKey / key / pem 欄位）。
async function getPublicKey() {
  const url = sub('{{rsaKeyUrl}}');
  if (/\{\{/.test(url)) throw new Error('請在環境變數設定 rsaKeyUrl（取得 RSA 公鑰的 GET 網址）');
  if (keyCache[url]) return keyCache[url];
  const j = await proxy({ url, method: 'GET', headers: { Accept: 'application/json' }, timeoutMs: 15000 });
  if (j.error) throw new Error('取得公鑰失敗：' + j.error);
  if (j.status >= 400) throw new Error('取得公鑰失敗：HTTP ' + j.status);
  let key = '';
  try { const b = JSON.parse(j.body); const d = b.data ?? b; key = typeof d === 'string' ? d : (d.publicKey || d.rsaPublicKey || d.key || d.pem || ''); } catch { key = j.body; }
  key = String(key).trim();
  if (!key) throw new Error('公鑰回應格式無法辨識');
  return (keyCache[url] = key);
}
// 把 {{$rsa(變數名)}} 換成「該變數值以公鑰加密後的 base64」。每次送出重新加密（PKCS#1 v1.5 每次密文都不同）。
async function resolveDynamic(r) {
  const names = new Set();
  const scan = (x) => { for (const m of String(x ?? '').matchAll(RSA_RE)) names.add(m[1]); };
  scan(r.url); scan(r.body); Object.values(r.headers).forEach(scan);
  if (!names.size) return;
  const key = await getPublicKey(); const out = {};
  for (const n of names) {
    const plain = vars()[n];
    if (plain === undefined || plain === '') throw new Error(`環境變數 ${n} 沒有值（{{$rsa(${n})}} 的加密來源）`);
    const j = await (await fetch('/crypto/rsa', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ publicKey: key, plain }) })).json();
    if (j.error) { delete keyCache[sub('{{rsaKeyUrl}}')]; throw new Error(j.error); }
    out[n] = j.cipher;
  }
  const re = (x) => (typeof x === 'string' ? x.replace(RSA_RE, (m, n) => out[n]) : x);
  r.url = re(r.url); r.body = re(r.body); for (const k in r.headers) r.headers[k] = re(r.headers[k]);
}
async function doSend(t) {
  const r = build(t);
  if (!r.url) return { error: '請輸入 URL' };
  if (!/^https?:\/\//i.test(r.url)) r.url = 'http://' + r.url;
  try { await resolveDynamic(r); } catch (e) { return { error: e.message }; }
  try { return await proxy({ ...r, timeoutMs: 30000 }); } catch (e) { return { error: String(e) }; }
}
function getPath(o, path) {
  const parts = path.replace(/\[(\d+)\]/g, '.$1').split('.').filter(Boolean);
  let v = o;
  for (const p of parts) { if (v == null || typeof v !== 'object') { v = undefined; break; } v = v[p]; }
  if (v === undefined && parts.length === 1) { // 單一欄位名：往下找
    const find = (x, d = 0) => { if (!x || typeof x !== 'object' || d > 5) return; if (parts[0] in x) return x[parts[0]]; for (const c of Object.values(x)) { const r = find(c, d + 1); if (r !== undefined) return r; } };
    v = find(o);
  }
  return v;
}
function setVar(k, v) {
  let env = S.envs.find((e) => e.id === S.env);
  if (!env) { env = { id: uid(), name: '預設', vars: [] }; S.envs.push(env); S.env = env.id; }
  const ex = env.vars.find((x) => x.k === k);
  if (ex) ex.v = v; else env.vars.push({ on: true, k, v, secret: /token|pass|secret/i.test(k) });
}
function applyExtract(t, res) {
  const rules = (t.extract || []).filter((x) => x.on !== false && x.k && x.v);
  if (!rules.length || res.error || !res.isText || res.status >= 400) return;
  let j; try { j = JSON.parse(res.body); } catch { return; }
  res.extracted = []; res.missing = [];
  for (const x of rules) {
    const v = getPath(j, x.k.trim());
    if (v === undefined || v === null) res.missing.push(x.k);
    else { setVar(x.v.trim(), typeof v === 'string' ? v : JSON.stringify(v)); res.extracted.push(x.v.trim()); }
  }
}
async function runLogin(collId) {
  const co = S.colls.find((c) => c.id === collId);
  const li = co && co.cfg && co.cfg.loginId && co.items.find((i) => i.id === co.cfg.loginId);
  if (!li) return { ok: false };
  const tmp = JSON.parse(JSON.stringify(li));
  const res = await doSend(tmp); applyExtract(tmp, res);
  return { ok: !res.error && res.status >= 200 && res.status < 300 && !(res.missing || []).length, res };
}
// 送出 → 擷取變數 → 若 401 且用「集合共用」auth，自動重登一次再重送
async function execute(t) {
  let res = await doSend(t); applyExtract(t, res);
  if (!res.error && res.status === 401 && t.auth.type === 'coll' && t.collId) {
    const lg = await runLogin(t.collId);
    if (lg.ok) { res = await doSend(t); applyExtract(t, res); res.relogin = true; } else res.reloginFailed = true;
  }
  return res;
}
const badges = (r) =>
  (r.relogin ? '<span class="hint">🔄 已自動重新登入</span>' : '') +
  (r.reloginFailed ? '<span style="color:var(--bad)">自動重登失敗</span>' : '') +
  (r.extracted && r.extracted.length ? `<span class="hint">✔ 已擷取 ${r.extracted.map(esc).join('、')}</span>` : '') +
  (r.missing && r.missing.length ? `<span style="color:var(--bad)">找不到欄位 ${r.missing.map(esc).join('、')}</span>` : '');

async function sendReq() {
  const t = cur();
  t.res = { loading: true }; renderRes();
  const res = await execute(t); t.res = res;
  if (!res.error) {
    S.hist.unshift({ id: uid(), at: Date.now(), status: res.status, req: strip(t) }); S.hist = S.hist.slice(0, 60);
    if (res.isText && /json/i.test(res.contentType || '')) captureToken(res);
  }
  persist(); renderRes(); renderSide();
}
const strip = ({ res, dirty, ...x }) => JSON.parse(JSON.stringify(x));
// 回應 JSON 裡若有 token 類欄位，提示一鍵存成環境變數
let lastToken = null;
function captureToken(res) { try { const j = JSON.parse(res.body); const f = (o, d = 0) => { if (!o || typeof o !== 'object' || d > 3) return; for (const [k, v] of Object.entries(o)) { if (/token/i.test(k) && typeof v === 'string' && v.length > 20) return [k, v]; const r = f(v, d + 1); if (r) return r; } }; lastToken = f(j) || null; } catch { lastToken = null; } }

/* ---------- 渲染：分頁列 ---------- */
function renderTabs() {
  $('#rtabs').innerHTML = S.tabs.map((t) => `<div class="rt ${t.id === S.active ? 'on' : ''}" data-id="${t.id}"><span class="mt ${t.method}">${t.method}</span><span class="n">${esc(t.name || t.url || '未命名')}</span>${t.dirty ? '<span class="dot">●</span>' : ''}<button class="ghost" data-close="${t.id}">✕</button></div>`).join('') + '<div class="rt" id="newtab">＋</div>';
}
$('#rtabs').onclick = (e) => {
  const c = e.target.closest('[data-close]'); if (c) { closeTab(c.dataset.close); return; }
  if (e.target.closest('#newtab')) { const t = blank(); S.tabs.push(t); S.active = t.id; return all(); }
  const r = e.target.closest('.rt[data-id]'); if (r) { S.active = r.dataset.id; all(); }
};
function closeTab(id) { S.tabs = S.tabs.filter((t) => t.id !== id); if (!S.tabs.length) S.tabs = [blank()]; if (!S.tabs.find((t) => t.id === S.active)) S.active = S.tabs[0].id; all(); }

/* ---------- 渲染：請求區 ---------- */
const REQTABS = [['params', 'Params'], ['headers', 'Headers'], ['body', 'Body'], ['auth', 'Auth'], ['extract', 'Extract']];
function kvEditor(arr, key, ph) {
  return arr.map((p, i) => `<div class="kv"><input type="checkbox" data-kv="${key}.${i}.on" ${p.on !== false ? 'checked' : ''}><input data-kv="${key}.${i}.k" value="${esc(p.k)}" placeholder="${ph[0]}" spellcheck="false"><input data-kv="${key}.${i}.v" value="${esc(p.v)}" placeholder="${ph[1]}" spellcheck="false"><button class="ghost" data-del="${key}.${i}">✕</button></div>`).join('') + `<button data-add="${key}">＋ 新增</button>`;
}
function renderReq() {
  const t = cur();
  $('#method').value = t.method; if ($('#url') !== document.activeElement) $('#url').value = t.url;
  $('#reqtabs').innerHTML = REQTABS.map(([k, n]) => {
    t.extract = t.extract || [];
    const c = k === 'params' ? t.params.filter((p) => p.k).length : k === 'headers' ? t.headers.filter((p) => p.k).length : k === 'extract' ? t.extract.filter((p) => p.k).length : 0;
    return `<button data-rt="${k}" class="${S.reqTab === k ? 'on' : ''}">${n}${c ? ` <span class="hint">(${c})</span>` : ''}</button>`;
  }).join('');
  let h = '';
  if (S.reqTab === 'params') h = kvEditor(t.params, 'params', ['key', 'value']);

const fmtSize = (n) => (n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB');
function hlJson(src) {
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false)\b|\b(null)\b|(-?\d+\.?\d*(?:[eE][+-]?\d+)?)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const [all, str, colon, bool, nul] = m;
    out += str ? (colon ? `<span class="k">${esc(str)}</span>${esc(colon)}` : `<span class="s">${esc(str)}</span>`) : bool ? `<span class="b">${all}</span>` : `<span class="nu">${all}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

  dlg(`<h3 style="margin-top:0">執行：${esc(co.name)}</h3><div id="runlog"></div><div class="row" style="margin-top:12px;justify-content:flex-end"><button value="close" class="pri">關閉</button></div>`, () => { persist(); renderEnv(); });

function shellSplit(s) {
  s = s.replace(/\\\r?\n/g, ' '); const out = []; let cur = '', has = false, i = 0;
  while (i < s.length) {
    const c = s[i];

function parseCurl(text) {

    else if (a === '-X' || a === '--request') r.method = (t[++i] || 'GET').toUpperCase();
    else if (['-d', '--data', '--data-raw', '--data-binary', '--data-ascii', '--data-urlencode'].includes(a)) data.push(t[++i]);
    else if (a === '-u' || a === '--user') { const [u, ...p] = (t[++i] || '').split(':'); r.auth = { type: 'basic', token: '', user: u, pass: p.join(':') }; }

    else if (a === '-A' || a === '--user-agent') r.headers.push({ on: true, k: 'User-Agent', v: t[++i] || '' });
    else if (a === '-e' || a === '--referer') r.headers.push({ on: true, k: 'Referer', v: t[++i] || '' });

    const ct = (r.headers.find((h) => h.k.toLowerCase() === 'content-type') || {}).v || '';

$('#btn-import').onclick = () => dlg(`<h3 style="margin-top:0">匯入 curl</h3><textarea id="d-curl" rows="9" placeholder="貼上整段 curl（支援 Chrome「Copy as cURL」）" style="width:100%"></textarea><div class="row" style="margin-top:10px;justify-content:flex-end"><button value="cancel">取消</button><button class="pri" value="ok">匯入成新分頁</button></div>`, (v) => { if (v !== 'ok') return; try { const r = parseCurl($('#d-curl').value); S.tabs.push(r); S.active = r.id; persist(); all(); } catch (e) { alert(e.message); } });
const q = (s) => "'" + String(s).replace(/'/g, "'\\''") + "'";

/* ---------- 匯出入檔案 ---------- */
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; a.click(); }
function importFile() { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json'; i.onchange = async () => { try { const j = JSON.parse(await i.files[0].text()); if (j.colls) S.colls.push(...j.colls.map((c) => ({ ...c, id: uid() }))); if (j.envs) S.envs.push(...j.envs.map((c) => ({ ...c, id: uid() }))); persist(); renderEnv(); renderSide(); } catch (e) { alert('匯入失敗：' + e.message); } }; i.click(); }

/* ---------- 快捷鍵 + 啟動 ---------- */
$('#send').onclick = sendReq;
document.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); sendReq(); } if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); $('#save').click(); } });

function apply(st) {

  S.active = S.tabs.find((t) => t.id === st.active) ? st.active : S.tabs[0].id;

async function boot() {

  else setSaved('ok');
