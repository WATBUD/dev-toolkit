<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 測試工具</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1c2128;--mut:#667085;--bd:#d8dce3;--pri:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--code:#f0f2f5;--hl:#e8efff}
@media(prefers-color-scheme:dark){:root{--bg:#12151a;--card:#1b2027;--fg:#e6e9ee;--mut:#98a2b3;--bd:#323a46;--pri:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--code:#14181d;--hl:#22304a}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card)}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:none}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:5px 10px}
button:hover{border-color:var(--pri)} button.pri{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
button.ghost{border:none;background:none;color:var(--mut);padding:2px 6px} button.ghost:hover{color:var(--bad)}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--card)}
header h1{font-size:14px;margin:0;white-space:nowrap}
#app{flex:1;min-height:0;display:grid;grid-template-columns:310px 1fr}
@media(max-width:760px){#app{grid-template-columns:1fr}#side{display:none}}
#side{border-right:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;min-height:0}
.stabs,.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd)}
.stabs button,.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:7px 10px;color:var(--mut)}
.stabs button.on,.tabs button.on{color:var(--fg);border-bottom-color:var(--pri);font-weight:600}
.sbody{flex:1;overflow:auto;padding:8px}
.item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer}
.item:hover{background:var(--code)} .item .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{font:700 10px ui-monospace,monospace;min-width:38px;text-align:center}
.GET{color:var(--ok)}.POST{color:var(--warn)}.PUT{color:var(--pri)}.PATCH{color:#7c3aed}.DELETE{color:var(--bad)}
.coll{margin-bottom:6px}.coll>.ch{display:flex;align-items:center;gap:4px;font-weight:600;padding:3px 2px}.coll>.ch{cursor:pointer;user-select:none;border-radius:6px}.coll>.ch:hover{background:var(--code)}.coll>.ch>.cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.coll>.ch .ghost{padding:2px 3px}.coll>.ch>.tw{width:12px;color:var(--mut);font-size:11px}
#work[hidden],.empty[hidden]{display:none!important}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut)}
.steps{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.step{padding:2px 8px;font-size:12px}.step.on{border-color:var(--pri);background:var(--hl)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.log{width:100%;border-collapse:collapse;font-size:12px}
.log td{padding:3px 4px;border-bottom:1px solid var(--bd);white-space:nowrap;cursor:pointer;word-break:normal}
.log td.ln{width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis}
.log tr:hover td{background:var(--code)}.log tr.on td{background:var(--hl)}
.log tr.sep td{border-bottom:2px solid var(--bd);padding:0;cursor:default}
.vmenu{position:fixed;z-index:50;width:320px;max-height:300px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 20px #0003}
.vmenu[hidden]{display:none}
.vm{padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}.vm:hover{background:var(--hl)}.vm .hint{word-break:break-all}
.vpick{font:600 11px ui-monospace,monospace;color:var(--pri)!important;padding:2px 4px}
.envbtn{font-size:11px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sortbtn{min-width:26px}.sortbtn.on{color:var(--pri)!important;font-weight:700}
.item[draggable=true]{cursor:grab}.item.dragging{opacity:.4}
.item.drop-before{box-shadow:inset 0 2px 0 var(--pri)}.item.drop-after{box-shadow:inset 0 -2px 0 var(--pri)}
.grip{color:var(--mut);font-size:10px;letter-spacing:-2px;opacity:.5}.item:hover .grip{opacity:1}
.var{border:1px solid var(--bd);border-radius:6px;padding:6px 8px;margin-bottom:6px}
.vval{font:12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;margin:2px 0}
.vsec{font-weight:600;font-size:12px;color:var(--mut);margin:10px 0 6px}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#rtabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--bd);background:var(--card)}
.rt{display:flex;align-items:center;gap:6px;padding:6px 10px;border-right:1px solid var(--bd);cursor:pointer;white-space:nowrap;max-width:200px;color:var(--mut)}
.rt.on{background:var(--bg);color:var(--fg)} .rt .n{overflow:hidden;text-overflow:ellipsis} .rt .dot{color:var(--warn)}
#work{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px;gap:8px}
.urlbar{display:flex;gap:6px}.urlbar select{width:105px;font-weight:700}.urlbar input{flex:1}
#req,#res{background:var(--card);border:1px solid var(--bd);border-radius:8px;display:flex;flex-direction:column;min-height:0}
#req{flex:0 0 auto;max-height:46%} #res{flex:1}
.pane{padding:8px;overflow:auto;min-height:90px}
.kv{display:grid;grid-template-columns:22px 1fr 1fr auto 24px;gap:4px;margin-bottom:4px;align-items:center}
.kv input[type=checkbox]{width:auto}
.hint{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{padding:1px 8px;border-radius:10px;font-weight:700}
.s2{background:#dcfce7;color:#166534}.s3{background:#dbeafe;color:#1e40af}.s4{background:#fef3c7;color:#92400e}.s5,.se{background:#fee2e2;color:#991b1b}
pre{margin:0;font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
#resbody{flex:1;overflow:auto;padding:8px}
.k{color:#2563eb}.s{color:#15803d}.nu{color:#b45309}.b{color:#7c3aed}
@media(prefers-color-scheme:dark){.k{color:#7dd3fc}.s{color:#86efac}.nu{color:#fcd34d}.b{color:#c4b5fd}}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);width:min(560px,92vw)}
dialog::backdrop{background:#0006}
table{border-collapse:collapse;width:100%}td{border-bottom:1px solid var(--bd);padding:3px 6px;vertical-align:top;word-break:break-all}td:first-child{color:var(--mut);white-space:nowrap}
.sr{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>⚡ API 測試工具</h1>
  <span class="hint">請求由本機 server 代發，無 CORS 限制</span>
  <span class="hint" id="saved"></span>
  <span style="flex:1"></span>
  <button id="btn-import">匯入 curl</button>
</header>
<div id="app">
  <aside id="side">
    <div class="stabs"><button data-s="coll" class="on">集合</button><button data-s="hist">歷史</button><button data-s="vars">變數</button><button data-s="log">日誌</button></div>
    <div class="sbody" id="sbody"></div>
  </aside>
  <div id="main">
    <div id="rtabs"></div>
    <div id="empty" class="empty" hidden>
      <div style="font-size:15px;color:var(--fg)">沒有開啟的請求</div>
      <div>從左邊的集合點一個請求，或按上方的 ＋ 新增</div>
      <button class="pri" id="empty-new">＋ 新增請求</button>
    </div>
    <div id="work">
      <div class="urlbar">
        <select id="method"></select>
        <input id="url" placeholder="https://api.example.com/path?x=1　（可用 {{變數}}）" spellcheck="false">
        <button class="pri" id="send">送出 ⌘↵</button>
        <button id="save">儲存</button>
        <button id="copycurl" title="複製成 curl">curl</button>
      </div>
      <section id="req">
        <div class="tabs" id="reqtabs"></div>
        <div class="pane" id="reqpane"></div>
      </section>
      <section id="res">
        <div class="sr" id="sr"><span class="hint">按「送出」查看回應</span></div>
        <div class="tabs" id="restabs" hidden></div>
        <div id="resbody"></div>
      </section>
    </div>
  </div>
</div>

<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>

<datalist id="vars-dl"></datalist>
<div id="vmenu" class="vmenu" hidden></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const METHODS = ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD', 'OPTIONS'];

const blank = () => ({ id: uid(), name: '', method: 'GET', url: '', params: [], headers: [], bodyType: 'none', body: '', form: [], auth: { type: 'none', token: '', user: '', pass: '' }, extract: [], next: '', collId: '', dirty: false, res: null });
const S = {
  tabs: [], active: null, colls: [], hist: [], envs: [], env: '',
  side: 'coll', reqTab: 'params', resTab: 'body', pretty: true, showSec: true, // showSec：「請求」分頁預設顯示機密原值，可取消勾選改成遮罩
};
const cur = () => S.tabs.find((t) => t.id === S.active);
// ---- 持久化：存到 server 的 test-data/ 資料夾（每個使用者本機自己產生，不進版控）----
let ready = false, dirty = false, saveTimer = null, dataDir = '';
// 集合與歷史存成 test-data/<分組>/<名稱>.curl、test-data/_history/*.curl（每個請求一個純 curl 檔）；分組設定、session、環境變數是 JSON。
// baseline = 目前磁碟上（本頁面載入或寫入過）的 路徑 -> 內容；只送出與 baseline 不同的檔案，
// 所以你手動編輯、本頁面沒動到的檔案不會被蓋掉。unparsed = 讀得到但解析不了的檔案：原樣保留，絕不寫入/刪除。
let baseline = {}, unparsed = {}, diskSnapshot = {}; // diskSnapshot：磁碟上目前的原始檔案內容（路徑 -> 文字）
const FILE_OF = new Map(); // 請求 id -> { file, forName }：沿用磁碟上的檔名，改名才換檔
const DIR_OF = new Map();  // 集合 id -> { dir, forName }
const snapshot = () => ({ tabs: S.tabs.map(({ res, ...t }) => t), active: S.active, envs: S.envs, env: S.env });
function setSaved(state, msg) {
  const el = $('#saved'); if (!el) return;
  el.textContent = state === 'ok' ? '💾 已儲存' : state === 'busy' ? '💾 儲存中…' : '⚠️ ' + msg;
  el.style.color = state === 'err' ? 'var(--bad)' : ''; el.title = dataDir ? '資料位置：' + dataDir : '';
}
function persist() { if (!ready) return; dirty = true; clearTimeout(saveTimer); setSaved('busy'); saveTimer = setTimeout(() => flush(), 300); }
let flushChain = Promise.resolve();
function flush(keepalive, force) { return (flushChain = flushChain.then(() => doFlush(keepalive, force))); } // 序列化，避免兩次存檔交錯
async function doFlush(keepalive, force) {
  if (!ready || (!dirty && !force)) return; clearTimeout(saveTimer); // 沒有未存變更就不寫，避免蓋掉外部（手動 / 其他分頁）對檔案的修改
  const files = buildFiles();
  const put = {}, del = [];
  for (const [p, t] of Object.entries(files)) if (baseline[p] !== t) put[p] = t;
  for (const p of Object.keys(baseline)) if (!(p in files) && !(p in unparsed)) del.push(p);
  const body = JSON.stringify({ ...snapshot(), put, del });
  try {
    const r = await fetch('/store', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body, keepalive: !!keepalive && body.length < 60000 });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
    baseline = files; dirty = false; setSaved('ok');
    for (const p of Object.keys(put)) diskSnapshot[p] = put[p]; for (const p of del) delete diskSnapshot[p]; // 我們自己寫的不算外部修改
  } catch (e) { setSaved('err', '儲存失敗：' + e.message); }
}
window.addEventListener('pagehide', () => flush(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(true); });

/* ---------- 變數 ---------- */
// 每個集合有自己的環境（_collection.json 的 env → environments.json 裡的某個環境）。
// 送出時用「該請求所屬集合」的環境；不在集合裡的分頁才用全域 S.env。
let ctxT = null; // 正在送出的請求：送出期間的變數代入與 Extract 都以它的集合為準
const collOf = (t) => (t && t.collId ? S.colls.find((c) => c.id === t.collId) : null);
// 串接 / 自動取公鑰 / 自動重登要執行集合裡的某個請求時：若它有開著的分頁，就用分頁裡「你現在看到的版本」（含未儲存的修改）
const liveReq = (item) => { const tab = S.tabs.find((x) => x.id === item.id); const r = JSON.parse(JSON.stringify(tab ? { ...strip(tab), collId: item.collId || tab.collId } : item)); if (tab && tab.dirty) r.__unsaved = true; return r; };
const envIdFor = (t) => { const co = collOf(t); return co ? co.env : S.env; };
const curEnv = () => S.envs.find((e) => e.id === envIdFor(ctxT || cur()));
const vars = () => Object.fromEntries(((curEnv() || {}).vars || []).filter((v) => v.on !== false && v.k).map((v) => [v.k, v.v]));
const sub = (s) => { const v = vars(); let out = String(s ?? ''); for (let i = 0; i < 3; i++) { const n = out.replace(/\{\{\s*([\w.-]+)\s*\}\}/g, (m, k) => (k in v ? v[k] : m)); if (n === out) break; out = n; } return out; };

/* ---------- URL <-> params ---------- */
function syncParamsFromUrl(t) {
  const q = t.url.split('#')[0].split('?')[1];
  const parsed = q ? q.split('&').filter(Boolean).map((p) => { const i = p.indexOf('='); const d = (x) => { try { return decodeURIComponent(x.replace(/\+/g, ' ')); } catch { return x; } }; return { on: true, k: d(i < 0 ? p : p.slice(0, i)), v: i < 0 ? '' : d(p.slice(i + 1)) }; }) : [];
  t.params = [...parsed, ...t.params.filter((p) => p.on === false)];
}
function syncUrlFromParams(t) {
  const [base, hash] = t.url.split('#'); const root = base.split('?')[0];
  const q = t.params.filter((p) => p.on !== false && p.k).map((p) => encodeURIComponent(p.k) + '=' + encodeURIComponent(p.v)).join('&');
  t.url = root + (q ? '?' + q : '') + (hash !== undefined ? '#' + hash : '');
}

/* ---------- 組裝請求 ---------- */
function build(t) {
  const headers = {};
  t.headers.filter((h) => h.on !== false && h.k).forEach((h) => (headers[sub(h.k)] = sub(h.v)));
  const has = (n) => Object.keys(headers).some((k) => k.toLowerCase() === n);
  if (t.auth.type === 'bearer' && t.auth.token && !has('authorization')) headers.Authorization = 'Bearer ' + sub(t.auth.token);
  if (t.auth.type === 'basic' && !has('authorization')) headers.Authorization = 'Basic ' + btoa(unescape(encodeURIComponent(sub(t.auth.user) + ':' + sub(t.auth.pass))));
  if (t.auth.type === 'coll') {
    const cfg = (S.colls.find((c) => c.id === t.collId) || {}).cfg || {};
    const tok = vars().token;
    if (tok) {
      const hn = cfg.header || 'Authorization';
      if (!has(hn.toLowerCase())) headers[hn] = (cfg.prefix ?? 'Bearer ') + tok;
      if (cfg.cookie) { // 有些後台同時驗 Cookie（如 authKey）
        const ck = Object.keys(headers).find((k) => k.toLowerCase() === 'cookie'); const pair = cfg.cookie + '=' + tok;
        if (!ck) headers.Cookie = pair;
        else if (!(';' + headers[ck].replace(/\s/g, '')).includes(';' + cfg.cookie + '=')) headers[ck] += '; ' + pair;
      }
    }
  }
  let body;
  if (t.bodyType === 'json') { body = sub(t.body); if (!has('content-type')) headers['Content-Type'] = 'application/json'; }
  else if (t.bodyType === 'text') { body = sub(t.body); if (!has('content-type')) headers['Content-Type'] = 'text/plain'; }
  else if (t.bodyType === 'form') { body = t.form.filter((f) => f.on !== false && f.k).map((f) => encodeURIComponent(sub(f.k)) + '=' + encodeURIComponent(sub(f.v))).join('&'); if (!has('content-type')) headers['Content-Type'] = 'application/x-www-form-urlencoded'; }
  return { url: sub(t.url.trim()), method: t.method, headers, body };
}

/* ---------- 送出 ---------- */
const keyCache = {};
const RSA_RE = /\{\{\s*\$rsa\(\s*([\w.-]+)\s*\)\s*\}\}/g;
async function proxy(p) {
  const resp = await fetch('/proxy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) });
  return resp.json();
}
// 取得 RSA 公鑰：GET 環境變數 rsaKeyUrl，回應 data 為 PEM 字串（或 publicKey / rsaPublicKey / key / pem 欄位）。
async function getPublicKey() {
  const pk = String(vars().publicKey || '').trim(); // 取公鑰的請求用 Extract 存成 publicKey 時，直接用它
  if (pk) return pk;
  const url = sub('{{rsaKeyUrl}}');
  if (/\{\{/.test(url)) throw new Error('沒有公鑰：請先執行取公鑰的請求（Extract 存成 publicKey），或在環境變數設定 rsaKeyUrl');
  if (keyCache[url]) return keyCache[url];
  const j = await proxy({ url, method: 'GET', headers: { Accept: 'application/json' }, timeoutMs: 15000 });
  if (j.error) throw new Error('取得公鑰失敗：' + j.error);
  if (j.status >= 400) throw new Error('取得公鑰失敗：HTTP ' + j.status);
  let key = '';
  try { const b = JSON.parse(j.body); const d = b.data ?? b; key = typeof d === 'string' ? d : (d.publicKey || d.rsaPublicKey || d.key || d.pem || ''); } catch { key = j.body; }
  key = String(key).trim();
  if (!key) throw new Error('公鑰回應格式無法辨識');
  return (keyCache[url] = key);
}
// 把 {{$rsa(變數名)}} 換成「該變數值以公鑰加密後的 base64」。每次送出重新加密（PKCS#1 v1.5 每次密文都不同）。
async function resolveDynamic(r) {
  const names = new Set();
  const scan = (x) => { for (const m of String(x ?? '').matchAll(RSA_RE)) names.add(m[1]); };
  scan(r.url); scan(r.body); Object.values(r.headers).forEach(scan);
  if (!names.size) return;
  const key = await getPublicKey(); const out = {};
  for (const n of names) {
    const plain = vars()[n];
    if (plain === undefined || plain === '') throw new Error(`環境變數 ${n} 沒有值（{{$rsa(${n})}} 的加密來源）`);
    const j = await (await fetch('/crypto/rsa', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ publicKey: key, plain }) })).json();
    if (j.error) { delete keyCache[sub('{{rsaKeyUrl}}')]; throw new Error(j.error); }
    out[n] = j.cipher;
  }
  const re = (x) => (typeof x === 'string' ? x.replace(RSA_RE, (m, n) => out[n]) : x);
  r.url = re(r.url); r.body = re(r.body); for (const k in r.headers) r.headers[k] = re(r.headers[k]);
}
async function doSend(t) { const prev = ctxT; ctxT = t; try { return await doSendInner(t); } finally { ctxT = prev; } }
async function doSendInner(t) {
  const r = build(t);
  if (!r.url) return { error: '請輸入 URL' };
  if (!/^https?:\/\//i.test(r.url)) r.url = 'http://' + r.url;
  let autoKey = '';
  const needsKey = [r.url, r.body, ...Object.values(r.headers)].some((x) => new RegExp(RSA_RE.source).test(String(x ?? '')));
  if (needsKey && !String(vars().publicKey || '').trim() && /\{\{/.test(sub('{{rsaKeyUrl}}'))) {
    const co = S.colls.find((c) => c.id === t.collId);
    const pv = co && co.items.map(liveReq).find((i) => i.id !== t.id && (i.extract || []).some((x) => x.on !== false && String(x.v).trim() === 'publicKey'));
    if (pv) {
      autoKey = pv.name || pv.url;
      const tmp = JSON.parse(JSON.stringify(pv)); const pres = await doSend(tmp); applyExtract(tmp, pres); logRes(tmp, pres, 'key');
      if (pres.error || pres.status >= 400 || !String(vars().publicKey || '').trim())
        return { error: `自動執行「${autoKey}」取得公鑰失敗` + (pres.error ? '：' + pres.error : pres.status >= 400 ? `（HTTP ${pres.status}）` : '（回應裡找不到要擷取成 publicKey 的欄位）') };
    }
  }
  try { await resolveDynamic(r); } catch (e) { return { error: e.message, req: { method: r.method, url: r.url, headers: r.headers, body: r.body } }; }
  try {
    const res = await proxy({ ...r, timeoutMs: 30000 });

let dragInfo = null;
(() => {
  const sb = $('#sbody');
  const clear = () => sb.querySelectorAll('.drop-before,.drop-after').forEach((n) => n.classList.remove('drop-before', 'drop-after'));
  sb.addEventListener('dragstart', (e) => {
    const it = e.target.closest('.item[data-dnd]'); if (!it) return;
    const [c, i] = it.dataset.dnd.split('|'); dragInfo = { c, i }; it.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', i); } catch {}
  });
  sb.addEventListener('dragend', () => { dragInfo = null; clear(); sb.querySelectorAll('.dragging').forEach((n) => n.classList.remove('dragging')); });
  sb.addEventListener('dragover', (e) => {
    const it = e.target.closest('.item[data-dnd]'); if (!it || !dragInfo || it.dataset.dnd.split('|')[0] !== dragInfo.c) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';

  });

/* ---------- curl 匯入 / 匯出 ---------- */
function shellSplit(s) {
  s = s.replace(/\\\r?\n/g, ' '); const out = []; let cur = '', has = false, i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === "'") { const j = s.indexOf("'", i + 1); cur += s.slice(i + 1, j < 0 ? s.length : j); has = true; i = j < 0 ? s.length : j + 1; }
    else if (c === '$' && s[i + 1] === "'") { i += 2; has = true; while (i < s.length && s[i] !== "'") { if (s[i] === '\\') { i++; cur += ({ n: '\n', t: '\t', r: '\r' }[s[i]] ?? s[i]); i++; } else cur += s[i++]; } i++; }
    else if (c === '"') { i++; has = true; while (i < s.length && s[i] !== '"') { if (s[i] === '\\' && i + 1 < s.length) i++; cur += s[i++]; } i++; }
    else if (c === '\\' && i + 1 < s.length) { cur += s[i + 1]; has = true; i += 2; } // 引號外的 \x 代表字面 x（如 '\'' 內的 \'）
    else if (/\s/.test(c)) { if (has) { out.push(cur); cur = ''; has = false; } i++; }
    else { cur += c; has = true; i++; }
  }
  if (has) out.push(cur); return out;
}

// opts.raw：不重新排版 JSON body（curl 檔讀回時要與磁碟內容一致，避免每次載入都產生差異）
function parseCurl(text, opts = {}) {
  const t = shellSplit(text.trim()); if (t[0] !== 'curl') throw new Error('開頭必須是 curl');
  const r = { ...blank(), headers: [] }; let data = [], form = false; const pos = [];
  for (let i = 1; i < t.length; i++) {
    const a = t[i];
    if (a === '-H' || a === '--header') { const h = t[++i] || ''; const k = h.indexOf(':'); if (k > 0) r.headers.push({ on: true, k: h.slice(0, k).trim(), v: h.slice(k + 1).trim() }); }
    else if (a === '-X' || a === '--request') r.method = (t[++i] || 'GET').toUpperCase();
    else if (['-d', '--data', '--data-raw', '--data-binary', '--data-ascii', '--data-urlencode'].includes(a)) data.push(t[++i]);
    else if (a === '-u' || a === '--user') { const [u, ...p] = (t[++i] || '').split(':'); r.auth = { type: 'basic', token: '', user: u, pass: p.join(':') }; }
    else if (a === '-b' || a === '--cookie') r.headers.push({ on: true, k: 'Cookie', v: t[++i] || '' });
    else if (a === '-A' || a === '--user-agent') r.headers.push({ on: true, k: 'User-Agent', v: t[++i] || '' });
    else if (a === '-e' || a === '--referer') r.headers.push({ on: true, k: 'Referer', v: t[++i] || '' });
    else if (a === '-F' || a === '--form') throw new Error('目前不支援 multipart (-F)');
    else if (/^https?:\/\//i.test(a)) r.url = a;
    else if (a === '--url') r.url = t[++i];

/* ---------- 請求檔：test-data/<分組>/<API 名稱>.curl ---------- */
// 一個請求 = 一個純 curl 檔，可以直接 `bash 檔名.curl` 執行。curl 表達不了的資訊放在檔案開頭的註解（全部選填）：
//   # @name 登入              請求名稱（省略時用檔名）
//   # @extract accessToken -> token     回應 JSON 欄位 → 環境變數
//   # @auth collection | bearer         集合共用 token / Bearer
//   # @bodytype json | text | form | none
// 從 Chrome「Copy as cURL」直接存下來的檔案也能讀。{{變數}} 保持原樣；
// 要實際執行請用介面上的「curl」按鈕複製已代入變數的版本。
const qsh = (s) => "'" + String(s).replace(/'/g, "'\\''") + "'";
const slug = (s) => String(s || '').normalize('NFKC').replace(/[{}]/g, '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').replace(/\s+/g, ' ').trim().replace(/^[._]+/, '').slice(0, 80).trim();
const meta1 = (k, v) => `# @${k} ${String(v).replace(/[\r\n]+/g, ' ')}`;
const encKv = (x) => encodeURIComponent(x).replace(/%7B%7B/gi, '{{').replace(/%7D%7D/gi, '}}');
const ord = (v) => (Number.isFinite(v) ? v : 1e9);
// 沒有 # @id 的檔案 / 沒有 _collection.json 的資料夾：用路徑算出固定 ID，開關多少次都不變（djb2 雜湊）
const hashId = (prefix, s) => { let h = 5381; for (const ch of s) h = ((h * 33) ^ ch.codePointAt(0)) >>> 0; return prefix + h.toString(36); };

function toCurlFile(t, extra = {}) {
  const L = ['# api-tester request', meta1('id', t.id)];
  if (t.name) L.push(meta1('name', t.name));
  for (const [k, v] of Object.entries(extra)) if (v !== undefined && v !== null) L.push(meta1(k, v));
  L.push(meta1('bodytype', t.bodyType));
  if (t.auth.type === 'coll') L.push(meta1('auth', 'collection'));
  if (t.next) L.push(meta1('next', t.next));
  (t.extract || []).filter((x) => x.k || x.v).forEach((x) => L.push(meta1(x.on === false ? 'extract-off' : 'extract', `${x.k} -> ${x.v}`)));
  t.headers.filter((h) => h.on === false && h.k).forEach((h) => L.push(meta1('header-off', `${h.k}: ${h.v}`)));
  t.params.filter((p) => p.on === false && p.k).forEach((p) => L.push(meta1('param-off', `${p.k}=${p.v}`)));
  const hs = t.headers.filter((h) => h.on !== false && h.k).map((h) => [h.k, h.v]);
  const has = (n) => hs.some(([k]) => k.toLowerCase() === n);
  if (t.auth.type === 'bearer' && t.auth.token && !has('authorization')) { hs.push(['Authorization', 'Bearer ' + t.auth.token]); L.splice(L.findIndex((x) => x.startsWith('# @bodytype')) + 1, 0, meta1('auth', 'bearer')); }

  else if (t.bodyType === 'form') { body = t.form.filter((f) => f.on !== false && f.k).map((f) => encKv(f.k) + '=' + encKv(f.v)).join('&'); if (!has('content-type')) hs.push(['Content-Type', 'application/x-www-form-urlencoded']); }

function fromCurlFile(text, stem = '', fallbackId = '') {
  const meta = {}, rest = []; let head = true;
  for (const l of text.replace(/\r\n/g, '\n').split('\n')) {
    if (head && (/^\s*#/.test(l) || !l.trim())) { const m = l.match(/^\s*#\s*@([\w-]+)[ \t]?(.*)$/); if (m) (meta[m[1]] ||= []).push(m[2]); continue; }

  } else if (bt === 'form' && r.bodyType !== 'form') { r.bodyType = 'form'; r.form = parseForm(r.body || ''); }
  if (r.bodyType === 'form') r.body = ''; // form 的內容在 r.form，body 欄位不使用
  if (m1('auth') === 'collection') r.auth = { type: 'coll', token: '', user: '', pass: '' };
  if (m1('auth') === 'bearer') { // 還原成 Bearer 認證，而不是一個普通的 Authorization header

function uniqName(base, used, ext = '') {

const reqFileBase = (t) => {
  if (slug(t.name)) return slug(t.name);
  const seg = slug(String(t.url).replace(/^[a-z]+:\/\/[^/]*/i, '').split('?')[0].split('/').filter(Boolean).pop() || '');
  return seg || slug(`${t.method} ${String(t.url).replace(/^https?:\/\//, '')}`).slice(0, 60) || 'request';
};

// 由目前狀態產生所有「應該存在」的檔案（路徑 -> 內容）。沿用磁碟上原本的檔名，只有改名/新增才取新檔名。
function buildFiles() {
  const files = {}, usedDirs = new Set();
  S.colls.forEach((c) => { const d = DIR_OF.get(c.id); if (d && d.forName === c.name) usedDirs.add(d.dir.toLowerCase()); });
  S.colls.forEach((c, ci) => {
    let d = DIR_OF.get(c.id);
    if (!d || d.forName !== c.name) { d = { dir: uniqName(slug(c.name) || '未分組', usedDirs), forName: c.name }; DIR_OF.set(c.id, d); }
    const base = d.dir;
    const used = new Set(['_collection.json']);
    Object.keys(unparsed).filter((p) => p.startsWith(base + '/')).forEach((p) => used.add(p.slice(base.length + 1).toLowerCase()));
    c.items.forEach((it) => { const f = FILE_OF.get(it.id); if (f && f.forName === it.name) used.add(f.file.toLowerCase()); });
    const order = []; // 側欄的順序（拖曳 / 依名稱排序）存在 _collection.json，不寫進 curl 檔
    c.items.forEach((it) => {
      let f = FILE_OF.get(it.id);
      if (!f || f.forName !== it.name) { f = { file: uniqName(reqFileBase(it), used, '.curl'), forName: it.name }; FILE_OF.set(it.id, f); }

  });
  for (const h of S.hist) {
    const ts = new Date(h.at || 0).toISOString().slice(0, 19).replace(/[-:]/g, '').replace('T', '-');
    const pth = slug(String(h.req.url).replace(/^[a-z]+:\/\/[^/]*/i, '').split('?')[0]).slice(0, 50);
    files[`_history/${ts}_${h.req.method}_${pth}_${h.id}.curl`] = toCurlFile(h.req, { hid: h.id, at: h.at, status: h.status });
  }

}

// 把磁碟上讀到的檔案還原成集合 / 歷史。

  unparsed = {}; FILE_OF.clear(); DIR_OF.clear();
  const seen = new Set(), dirs = {}, hist = [];
  const uniqueId = (id) => { if (!id || seen.has(id)) id = uid(); seen.add(id); return id; };
  for (const [p, text] of Object.entries(files)) {

      try { const x = fromCurlFile(text); hist.push({ id: x.hid || uid(), at: x.at || 0, status: x.status, req: strip(x.req) }); }
      catch { unparsed[p] = text; }
    } else if ((m = p.match(/^([^/]+)\/([^/]+)$/))) {

      try {
        if (m[2] === '_collection.json') c.meta = JSON.parse(text) || {};
        else { const x = fromCurlFile(text, m[2].replace(/\.curl$/i, ''), hashId('r', p)); x.req.id = uniqueId(x.req.id); c.items.push({ ...x, f: m[2] }); }
      } catch { unparsed[p] = text; }
    }
  }
  const colls = Object.values(dirs).map((c) => {
    const id = uniqueId(c.meta.id || hashId('c', c.dir)), name = c.meta.name || c.dir;
    DIR_OF.set(id, { dir: c.dir, forName: name });
    const pos = (f) => { const i = Array.isArray(c.meta.items) ? c.meta.items.indexOf(f) : -1; return i < 0 ? 1e9 : i; };
    const items = c.items.sort((a, b) => pos(a.f) - pos(b.f) || ord(a.order) - ord(b.order) || a.f.localeCompare(b.f)).map((x) => {
      x.req.collId = id; FILE_OF.set(x.req.id, { file: x.f, forName: x.req.name }); return strip(x.req);
    });
    return { id, name, cfg: c.meta.cfg, order: c.meta.order, sort: c.meta.sort === 'asc' || c.meta.sort === 'desc' ? c.meta.sort : undefined, manual: Array.isArray(c.meta.manual) ? c.meta.manual : undefined, collapsed: c.meta.collapsed === true || undefined, env: c.meta.env || undefined, items };
  }).sort((a, b) => ord(a.order) - ord(b.order) || a.name.localeCompare(b.name));
  return { colls, hist: hist.sort((a, b) => b.at - a.at) };
}

$('#btn-import').onclick = () => dlg(`<h3 style="margin-top:0">匯入 curl</h3><textarea id="d-curl" rows="9" placeholder="貼上整段 curl（支援 Chrome「Copy as cURL」）" style="width:100%"></textarea><div class="row" style="margin-top:10px;justify-content:flex-end"><button value="cancel">取消</button><button class="pri" value="ok">匯入成新分頁</button></div>`, (v) => { if (v !== 'ok') return; try { const r = parseCurl($('#d-curl').value); S.tabs.push(r); S.active = r.id; persist(); all(); } catch (e) { alert(e.message); } });
const q = (s) => "'" + String(s).replace(/'/g, "'\\''") + "'";
$('#copycurl').onclick = (e) => { if (!cur()) return; const r = build(cur()); let c = `curl -X ${r.method} ${q(r.url)}`; for (const [k, v] of Object.entries(r.headers)) c += ` \\\n  -H ${q(k + ': ' + v)}`; if (r.body) c += ` \\\n  --data-raw ${q(r.body)}`; navigator.clipboard.writeText(c).then(() => { e.target.textContent = '已複製 ✓'; setTimeout(() => (e.target.textContent = 'curl'), 1200); }); };

/* ---------- 匯出入檔案 ---------- */
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; a.click(); }
function importFile() { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json'; i.onchange = async () => { try { const j = JSON.parse(await i.files[0].text()); if (j.colls) S.colls.push(...j.colls.map((c) => ({ ...c, id: uid() }))); if (j.envs) S.envs.push(...j.envs.map((c) => ({ ...c, id: uid() }))); persist(); renderEnv(); renderSide(); } catch (e) { alert('匯入失敗：' + e.message); } }; i.click(); }

/* ---------- 快捷鍵 + 啟動 ---------- */
$('#send').onclick = sendReq;
document.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); sendReq(); } if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); $('#save').click(); } });
function all() { renderTabs(); renderReq(); renderRes(); renderSide(); renderEnv(); persist(); }
function apply(st) {
  // 完全空白、沒改過的分頁（沒網址、沒名稱）不保留：不需要「至少一個分頁」，要新的請使用者自己按 ＋
  S.tabs = (st.tabs || []).filter((t) => t.url || t.name || t.dirty).map((t) => ({ ...blank(), ...t, res: null }));
  S.active = S.tabs.find((t) => t.id === st.active) ? st.active : (S.tabs[0] ? S.tabs[0].id : null);
  S.colls = st.colls || []; S.hist = st.hist || []; S.envs = st.envs || []; S.env = st.env || '';
}
async function boot() {
  let st = null;
  try {
    const r = await fetch('/store'); st = await r.json();
    if (!r.ok) throw new Error(st.error || 'HTTP ' + r.status);
  } catch (e) {
    // 讀取失敗時「不啟用儲存」，避免用空資料把磁碟上的檔案蓋掉。
    setSaved('err', '無法讀取本機資料：' + e.message + '（為避免覆蓋已停用儲存）'); all(); return;
  }
  dataDir = st.dir || '';
  const hasFiles = st.files && Object.keys(st.files).length;
  diskSnapshot = { ...(st.files || {}) };
  if (hasFiles) { const x = fromFiles(st.files); st.colls = x.colls; st.hist = x.hist; }
  if (!st.empty) apply(st);
  if (S.env) S.colls.forEach((c) => { if (!c.env) c.env = S.env; }); // 舊資料：集合沿用原本全域選的環境
  // 上次開著的分頁若對應到磁碟上的請求、且沒有未存的修改，就以磁碟上最新內容為準（你在資料夾裡手動改過 curl 也會反映）
  const byId = new Map(S.colls.flatMap((c) => c.items.map((i) => [i.id, i])));
  S.tabs = S.tabs.map((t) => { const it = byId.get(t.id); return it && !t.dirty ? { ...blank(), ...JSON.parse(JSON.stringify(it)), res: null } : t; });
  baseline = hasFiles ? buildFiles() : {}; // 以「載入當下的狀態」為基準，沒改動的檔案維持磁碟原樣
  ready = true; all();
  clearTimeout(saveTimer); dirty = false; // 剛載入不算「有變更」，不要立刻回寫
  const bad = Object.keys(unparsed).filter((p) => ((st.files || {})[p] || '').trim()); // 空檔案是預先建好的檔名，不提醒
  setSaved('ok');
  if (bad.length) alert(`有 ${bad.length} 個檔案無法解析，已原樣保留（不會被修改或刪除）：\n` + bad.slice(0, 8).join('\n'));
}
/* ---------- 切回瀏覽器時自動重新讀取資料夾（新增 / 修改 curl 立刻反映）---------- */
let syncing = false, syncTimer = null;
const sameFiles = (a, b) => { const ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every((k) => a[k] === b[k]); };
async function syncFromDisk() {
  if (!ready || syncing || dirty || $('#dlg').open) return; // 有未存變更、或正在編輯對話框時不動，下次切回再讀
  syncing = true;
  try {
    await flushChain;
    if (dirty) return;
    const r = await fetch('/store'); if (!r.ok) return;
    const files = (await r.json()).files || {};
    if (dirty || sameFiles(files, diskSnapshot)) return; // 磁碟沒有變化就什麼都不做（不會清掉你的回應結果）
    const x = fromFiles(files);
    S.colls = x.colls; S.hist = x.hist; diskSnapshot = { ...files };
    if (S.env) S.colls.forEach((c) => { if (!c.env) c.env = S.env; });
    // 開著的分頁：沒有未存修改、且磁碟上的內容和分頁不同，才換成磁碟上的最新內容
    const byId = new Map(S.colls.flatMap((c) => c.items.map((i) => [i.id, i])));
    S.tabs = S.tabs.map((t) => { const it = byId.get(t.id); return it && !t.dirty && toCurlFile(t) !== toCurlFile(it) ? { ...blank(), ...JSON.parse(JSON.stringify(it)), res: null } : t; });
    baseline = buildFiles();
    renderSide(); renderTabs(); renderReq(); renderRes();
    const n = S.colls.reduce((a, c) => a + c.items.length, 0);
    const el = $('#saved'); el.style.color = ''; el.textContent = `🔄 已重新讀取資料夾（${S.colls.length} 個集合、${n} 個請求）`;
    setTimeout(() => { if (!dirty) setSaved('ok'); }, 3500);
  } catch { /* 讀取失敗就保持現狀，下次切回再試 */ }
  finally { syncing = false; }
}
const scheduleSync = () => { clearTimeout(syncTimer); syncTimer = setTimeout(syncFromDisk, 250); };
window.addEventListener('focus', scheduleSync);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleSync(); });

boot();
</script>
